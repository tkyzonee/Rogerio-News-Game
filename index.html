<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lula vs Bolsonaro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #050510 100%);
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(255, 0, 255, 0.2);
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.6);
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 16, 0.85);
            backdrop-filter: blur(4px);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
            text-align: center;
        }

        p.subtitle {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 16px;
        }

        .neon-btn {
            background: transparent;
            color: #f0f;
            border: 2px solid #f0f;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px #f0f, inset 0 0 10px #f0f;
            text-shadow: 0 0 5px #f0f;
            transition: all 0.2s ease;
        }

        .neon-btn:hover {
            background: #f0f;
            color: #365;
            box-shadow: 0 0 20px #f0f, inset 0 0 20px #f0f;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
            pointer-events: none;
            z-index: 5;
        }

        #grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            z-index: 1;
            pointer-events: none;
        }

        #gameCanvas { position: relative; z-index: 2; }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            p.subtitle { font-size: 0.75rem; margin-bottom: 18px; }
            .neon-btn { font-size: 0.95rem; padding: 10px 18px; }
            #hud { font-size: 0.75rem; top: 8px; left: 10px; right: 10px; }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="grid-bg"></div>

        <div id="hud">
            <div>SCORE: <span id="scoreVal">6969</span></div>
            <div>LIVES: <span id="livesVal">777</span></div>
        </div>

        <div id="ui-layer">
            <h1 id="game-title">Lula Vs Bolsonaro</h1>
            <p class="subtitle" id="game-message">Controle com os pés, mãos não são necessario. #SemMãos #tkyzone</p>
            <button class="neon-btn" id="start-btn">Não sei se começa por aqui</button>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const uiLayer = document.getElementById("ui-layer");
        const startBtn = document.getElementById("start-btn");
        const gameTitle = document.getElementById("game-title");
        const gameMessage = document.getElementById("game-message");
        const scoreUI = document.getElementById("scoreVal");
        const livesUI = document.getElementById("livesVal");

        let animationId;
        let isPlaying = false;
        let score = 6969;
        let lives = 777;

        const colors = [
    '#009739', // Verde da bandeira do Brasil
    '#FFDF00', // Amarelo da bandeira
    '#002776', // Azul da bandeira
    '#FF0000', // Vermelho para Lula
    '#CC0000'  // Vermelho escuro para Lula
];

        const INITIAL_BALL_SPEED = 35;

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 40,
            dx: INITIAL_BALL_SPEED,
            dy: -INITIAL_BALL_SPEED,
            radius: 8,
            color: '#ffffff',
            glow: '#00FFFF'
        };

        const paddle = {
            height: 15,
            width: 120,
            x: (canvas.width - 120) / 2,
            y: canvas.height - 20,
            color: '#ffffff',
            glow: '#FF00FF',
            speed: 25,
            dx: 0
        };

        const brickConfig = {
            rowCount: 6,
            columnCount: 8,
            width: 80,
            height: 25,
            padding: 15,
            offsetTop: 60,
            offsetLeft: 25
        };

        let bricks = [];
        let rightPressed = false;
        let leftPressed = false;

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickConfig.columnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    const neonColor = colors[r % colors.length];
                    const brickX = (c * (brickConfig.width + brickConfig.padding)) + brickConfig.offsetLeft;
                    const brickY = (r * (brickConfig.height + brickConfig.padding)) + brickConfig.offsetTop;
                    bricks[c][r] = {
                        x: brickX,
                        y: brickY,
                        status: 1,
                        color: neonColor
                    };
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = ball.glow;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = paddle.glow;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawBricks() {
            for (let c = 0; c < brickConfig.columnCount; c++) {
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status !== 1) continue;

                    ctx.beginPath();
                    ctx.roundRect(b.x, b.y, brickConfig.width, brickConfig.height, 4);
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = b.color;
                    ctx.stroke();
                    ctx.fillStyle = b.color + '40';
                    ctx.fill();
                    ctx.closePath();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // Usa o raio da bola e verifica cada pequeno passo do movimento,
        // evitando que a bola atravesse os blocos em alta velocidade.
        function collisionDetection() {
            for (let c = 0; c < brickConfig.columnCount; c++) {
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status !== 1) continue;

                    const closestX = Math.max(b.x, Math.min(ball.x, b.x + brickConfig.width));
                    const closestY = Math.max(b.y, Math.min(ball.y, b.y + brickConfig.height));
                    const distX = ball.x - closestX;
                    const distY = ball.y - closestY;

                    if (distX * distX + distY * distY <= ball.radius * ball.radius) {
                        b.status = 0;
                        ball.dy = -ball.dy;
                        score += 10;
                        scoreUI.innerText = score;
                        ball.glow = b.color;

                        const remainingBricks = bricks.flat().filter(brick => brick.status === 1).length;
                        if (remainingBricks === 0) {
                            gameOver(true);
                        }
                        return true;
                    }
                }
            }
            return false;
        }

        function moveBallSafely() {
            const maxStep = Math.max(1, ball.radius / 2);
            const steps = Math.ceil(Math.max(Math.abs(ball.dx), Math.abs(ball.dy)) / maxStep);
            const stepX = ball.dx / steps;
            const stepY = ball.dy / steps;

            for (let i = 0; i < steps; i++) {
                if (!isPlaying) return;

                // Move horizontalmente e rebate nas paredes.
                ball.x += stepX;
                if (ball.x + ball.radius >= canvas.width) {
                    ball.x = canvas.width - ball.radius;
                    ball.dx = -Math.abs(ball.dx);
                } else if (ball.x - ball.radius <= 0) {
                    ball.x = ball.radius;
                    ball.dx = Math.abs(ball.dx);
                }

                // Move verticalmente e rebate no teto.
                ball.y += stepY;
                if (ball.y - ball.radius <= 0) {
                    ball.y = ball.radius;
                    ball.dy = Math.abs(ball.dy);
                }

                // Detecta blocos em cada pequeno passo.
                if (collisionDetection()) {
                    // O movimento restante usa a direção vertical já invertida.
                    // A saída evita quebrar vários blocos com o mesmo contato.
                    return;
                }

                // Colisão com a barra e com o chão.
                if (ball.dy > 0 &&
                    ball.y + ball.radius >= paddle.y &&
                    ball.y - ball.radius <= paddle.y + paddle.height &&
                    ball.x >= paddle.x &&
                    ball.x <= paddle.x + paddle.width) {

                    ball.y = paddle.y - ball.radius;
                    ball.dy = -Math.abs(ball.dy);
                    const hitPoint = ball.x - (paddle.x + paddle.width / 2);
                    ball.dx = Math.max(-INITIAL_BALL_SPEED, Math.min(INITIAL_BALL_SPEED, hitPoint * 0.5));
                } else if (ball.y - ball.radius > canvas.height) {
                    lives--;
                    livesUI.innerText = lives;

                    if (lives <= 0) {
                        lives = 0;
                        livesUI.innerText = lives;
                        gameOver(false);
                        return;
                    }

                    resetBall();
                    return;
                }
            }
        }

        function draw() {
            if (!isPlaying) return;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawBall();
            drawPaddle();

            // Move a bola em passos pequenos para não pular por cima dos blocos.
            moveBallSafely();

            // Movimento da barra via teclado.
            if (rightPressed) {
                paddle.x = Math.min(canvas.width - paddle.width, paddle.x + paddle.speed);
            } else if (leftPressed) {
                paddle.x = Math.max(0, paddle.x - paddle.speed);
            }

            // Mantém a barra dentro do canvas.
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            if (isPlaying) animationId = requestAnimationFrame(draw);
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 40;
            ball.dx = INITIAL_BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -INITIAL_BALL_SPEED;
            paddle.x = (canvas.width - paddle.width) / 2;
        }

        function gameOver(isWin) {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            uiLayer.classList.remove("hidden");

            if (isWin) {
                gameTitle.innerText = "SYSTEM HACKED";
                gameTitle.style.color = "#0f0";
                gameTitle.style.textShadow = "0 0 10px #0f0, 0 0 20px #0f0";
                gameMessage.innerText = `Lula e Bolsonaro perderam a eleição, bob esponja ganhou! Votos finais: ${score}`;
                startBtn.innerText = "Lixadeira Mustangue";
                startBtn.style.borderColor = "#0f0";
                startBtn.style.color = "#0f0";
                startBtn.style.boxShadow = "0 0 10px #0f0, inset 0 0 10px #0f0";
            } else {
                gameTitle.innerText = "HAHAHAHAHAHAHA";
                gameTitle.style.color = "#f00";
                gameTitle.style.textShadow = "0 0 10px #f00, 0 0 20px #f00";
                gameMessage.innerText = `Sistema bloqueado. Pontuação: ${score}`;
                startBtn.innerText = "Tentar Novamente";
                startBtn.style.borderColor = "#f00";
                startBtn.style.color = "#f00";
                startBtn.style.boxShadow = "0 0 10px #f00, inset 0 0 10px #f00";
            }
        }

        function startGame() {
            score = 6969;
            lives = 777;
            scoreUI.innerText = score;
            livesUI.innerText = lives;
            initBricks();
            resetBall();

            // Restaura a aparência inicial do título e botão ao recomeçar.
            gameTitle.innerText = "Lula Vs Bolsonaro";
            gameTitle.style.color = "#fff";
            gameTitle.style.textShadow = "0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff";
            gameMessage.innerText = "Controle com os pés, mãos não são necessario. #SemMãos #tkyzone";
            startBtn.innerText = "Não sei se começa por aqui";
            startBtn.style.borderColor = "#f0f";
            startBtn.style.color = "#f0f";
            startBtn.style.boxShadow = "0 0 10px #f0f, inset 0 0 10px #f0f";

            uiLayer.classList.add("hidden");
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            isPlaying = true;
            draw();
        }

        startBtn.addEventListener("click", startGame);

        document.addEventListener("keydown", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        });

        function handleMove(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const relativeX = (clientX - rect.left) * scaleX;

            if (relativeX >= 0 && relativeX <= canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
                paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
            }
        }

        canvas.addEventListener("mousemove", (e) => handleMove(e.clientX));

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (e.touches.length > 0) handleMove(e.touches[0].clientX);
        }, { passive: false });
    </script>
</body>
</html>
